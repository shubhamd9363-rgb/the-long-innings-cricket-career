
name: Extract Cricket Game Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o LongInnings_Project_Download.zip -d extracted

      - name: Locate project folder
        run: |
          PROJECT=$(find extracted -type f -name package.json -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Project directory: $PROJECT"

      - name: Copy complete project
        run: |
          cp -a "$PROJECT"/. .

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract cricket game source from ZIP" || echo "Nothing to commit"
          git push
